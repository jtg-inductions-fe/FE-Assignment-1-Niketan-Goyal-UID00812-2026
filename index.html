<!doctype html>
<html lang="en">
    <head>
        <title>Travel With Us</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Travel With Us - We always make our customer happy by providing
as many choices as possible "
        />

        <link rel="stylesheet" href="src/styles/main.scss" />
        <link rel="icon" type="image/svg+xml" href="/assets/icons/logo.svg" />
    </head>
    <body>
        <header class="header">
            <div class="header__icons">
                <a href="/" class="header__logo">
                    <img src="/assets/icons/logo.svg" alt="logo" />
                </a>
                <button class="header__menu" aria-label="open menu">
                    <img
                        class="header__menu--img"
                        src="/assets/icons/menu.svg"
                        alt="menu"
                    />
                </button>
            </div>
            <!-- only show in desktop or larger screens -->
            <nav class="header__navigation">
                <ul class="header__list">
                    <li class="header__item">
                        <a href="#home" class="header__link">Home</a>
                    </li>
                    <li class="header__item">
                        <a href="#discover" class="header__link">Discover</a>
                    </li>
                    <li class="header__item">
                        <a href="#special_deals" class="header__link"
                            >Special Deals</a
                        >
                    </li>
                    <li class="header__item">
                        <a href="#contact" class="header__link">Contact</a>
                    </li>
                </ul>
            </nav>

            <div class="header__actions">
                <button class="button button--secondary">Log In</button>
                <button class="button button--primary">Sign Up</button>
            </div>
        </header>
        <div class="bg-orange"></div>
        <main class="hero">
            <div class="hero__section">
                <div class="hero__left">
                    <div class="hero__content">
                        <div class="hero__button">
                            <p class="color-pink">Explore the World</p>
                            <img
                                src="/assets/icons/work-1.svg"
                                alt=" a small Explore icon"
                            />
                        </div>
                        <h1 class="hero__heading">
                            Travel
                            <span class="color-pink">top destination</span> of
                            the world
                        </h1>
                        <div class="hero__description description">
                            <p class="">We always make our customer happy by</p>
                            <p class="">providing</p>
                            <p class="">as many choices as possible</p>
                        </div>
                        <div class="hero__actions">
                            <button
                                class="hero__actions--get-started button button--primary"
                            >
                                Get Started
                            </button>
                            <button
                                class="hero__actions--watch-demo button button--secondary"
                            >
                                <img
                                    src="/assets/icons/watch-demo.svg"
                                    alt="Watch Demo"
                                />
                                Watch Demo
                            </button>
                            <div class="hero__side-arrows">
                                <img
                                    src="/assets/images/side-arrows.svg"
                                    alt="upwards arrows"
                                />
                            </div>
                        </div>
                    </div>
                </div>
                <div class="hero__right">
                    <div class="hero__gallery">
                        <div class="hero__images">
                            <div class="hero__images-left">
                                <img
                                    src="/assets/images/hero-section-1.webp"
                                    alt="Traveler enjoying a peaceful view of the sea"
                                    class="hero_right--image"
                                />

                                <img
                                    src="/assets/images/hero-section-2.webp"
                                    alt="Traveler sitting on a mountain "
                                />
                            </div>

                            <div class="hero__images-right">
                                <img
                                    src="/assets/images/hero-section-3.webp"
                                    alt="Traveler taking a photo"
                                />
                            </div>

                            <div class="hero__images--tele">
                                <img
                                    src="/assets/icons/telegram.svg"
                                    alt=""
                                    width="32px"
                                />
                            </div>
                            <div class="hero__images--user">
                                <img
                                    src="/assets/icons/user-logo.svg"
                                    alt="user icon"
                                    width="32px"
                                />
                            </div>
                            <div class="hero__images--top-places">
                                <img
                                    src="/assets/icons/location.svg"
                                    alt="location"
                                />
                                Top Places
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
