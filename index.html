<!doctype html>
<html lang="en">
    <head>
        <title>Title</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="src/styles/main.scss" />
    </head>
    <body>
        <header class="header">
            <div class="header__nav">
                <img
                    src="/assets/images/logo.png"
                    alt="logo"
                    class="header__logo"
                />
                <img
                    src=" /assets/images/Hamburger.png"
                    alt="menu"
                    class="header__menu"
                />
            </div>
            <!-- only show in desktop or larger screens -->

            <nav class="header__navigation">
                <ul class="header__list">
                    <li class="header__item">
                        <a href="#home" class="header__link">Home</a>
                    </li>
                    <li class="header__item">
                        <a href="#discover" class="header__link">Discover</a>
                    </li>
                    <li class="header__item">
                        <a href="#special_deals" class="header__link"
                            >Special Deals</a
                        >
                    </li>
                    <li class="header__item">
                        <a href="#contact" class="header__link">Contact</a>
                    </li>
                </ul>
            </nav>

            <div class="header__actions">
                <button class="button button--secondary">Login</button>

                <button class="button button--primary">Sign Up</button>
            </div>
        </header>
        <div class="bg-orange"></div>
        <main class="hero">
            <div class="hero__section">
                <div class="hero__left">
                    <div class="hero__left__section">
                        <div class="hero__button">
                            <p class="color-pink">Explore the World</p>
                            <img
                                src="/assets/images/Explore_the_world.png"
                                alt=""
                            />
                        </div>
                        <h1 class="hero__heading">
                            Travel
                            <span class="color-pink">top destination</span> of
                            the world
                        </h1>
                        <div class="color-grey hero__subheading">
                            <p class="">We always make our customer happy by</p>
                            <p class="">providing</p>
                            <p class="">as many choices as possible</p>
                        </div>
                        <div class="hero__actions">
                            <button
                                class="hero__actions--get-started button button--primary"
                            >
                                Get Started
                            </button>
                            <button
                                class="hero__actions--watch-demo button button--secondary"
                            >
                                <img
                                    src="/assets/images/Watch_demo.png"
                                    alt="Watch Demo"
                                />
                                Watch Demo
                            </button>
                            <div class="hero__side-arrows">
                                <img src="/assets/images/OBJECTS.png" alt="" />
                            </div>
                        </div>
                    </div>
                </div>
                <div class="hero__right">
                    <div class="hero__right__section">
                        <div class="hero__right__main">
                            <div class="hero__right__left">
                                <img
                                    src="/assets/images/hero_section_1.jpg"
                                    alt=""
                                    class="hero_right--image"
                                />
                                <img
                                    src="/assets/images/hero_section_2.jpg"
                                    alt=""
                                />
                            </div>
                            <div class="hero__right__right">
                                <img
                                    src="/assets/images/hero_section_3.jpg"
                                    alt=""
                                />
                            </div>
                            <div class="hero__right__main--tele">
                                <img
                                    src="/assets/images/send.png"
                                    alt=""
                                    width="32px"
                                />
                            </div>
                            <div class="hero__right__main--user">
                                <img
                                    src="/assets/images/add-user.png"
                                    width="32px"
                                />
                            </div>
                            <div class="hero__right__main--top-places">
                                <img src="/assets/images/location.png" alt="" />
                                Top Places
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </body>
    <script type="module" src="./src/script/index.js"></script>
</html>
